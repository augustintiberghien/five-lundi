name: Lock session du lundi 21h30

on:
  workflow_dispatch:
  schedule:
    # GitHub retarde parfois fortement les triggers "schedule" (observé : ~1h30-1h40
    # de retard les 29 juin et 6 juillet, execution réelle vers 23h10-23h12 au lieu de
    # 21h35 visé). On multiplie les tentatives de 21h30 à 22h30 Paris (5-10 min d'écart)
    # pour rattraper le retard au plus tôt ; chaque entrée est doublée pour couvrir été
    # (UTC+2) et hiver (UTC+1). Le script vérifie l'heure de Paris et ne fait rien avant
    # 21h30, et s'arrête sans rien commiter si la session du jour existe déjà (idempotent).
    - cron: '30 19 * * 1'
    - cron: '35 19 * * 1'
    - cron: '40 19 * * 1'
    - cron: '45 19 * * 1'
    - cron: '50 19 * * 1'
    - cron: '55 19 * * 1'
    - cron: '0 20 * * 1'
    - cron: '10 20 * * 1'
    - cron: '20 20 * * 1'
    - cron: '30 20 * * 1'
    - cron: '40 20 * * 1'
    - cron: '50 20 * * 1'
    - cron: '0 21 * * 1'
    - cron: '10 21 * * 1'
    - cron: '20 21 * * 1'
    - cron: '30 21 * * 1'
    - cron: '40 21 * * 1'
    - cron: '50 21 * * 1'
    - cron: '0 22 * * 1'
    - cron: '10 22 * * 1'
    - cron: '20 22 * * 1'
    - cron: '30 22 * * 1'

concurrency:
  group: lock-session
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Promouvoir le créneau du jour en session figée
        env:
          TRIGGER: ${{ github.event_name }}
        run: python3 .github/scripts/lock_session.py

      - name: Commit & push si changement
        run: |
          git config user.name "five-lundi-bot"
          git config user.email "bot@five-lundi.fr"
          git add index.html
          git diff --cached --quiet && echo "Rien à committer" && exit 0
          git commit -m "Auto : lock 21h30 — compo du lundi figée dans SESSIONS"
          git push origin HEAD:main
