name: Lock session du lundi 21h30

on:
  workflow_dispatch:
  schedule:
    # Lundi 21h35 Paris — le cron est en UTC, doublé pour couvrir été (UTC+2)
    # et hiver (UTC+1) ; le script vérifie l'heure de Paris et ne fait rien
    # si ce n'est pas encore 21h30 (l'autre exécution sort immédiatement)
    - cron: '35 19 * * 1'
    - cron: '35 20 * * 1'

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Promouvoir le créneau du jour en session figée
        env:
          TRIGGER: ${{ github.event_name }}
        run: python3 .github/scripts/lock_session.py

      - name: Commit & push si changement
        run: |
          git config user.name "five-lundi-bot"
          git config user.email "bot@five-lundi.fr"
          git add index.html
          git diff --cached --quiet && echo "Rien à committer" && exit 0
          git commit -m "Auto : lock 21h30 — compo du lundi figée dans SESSIONS"
          git push origin main
