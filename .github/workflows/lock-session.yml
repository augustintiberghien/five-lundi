name: Lock session du lundi 21h30

on:
  workflow_dispatch:
  schedule:
    # GitHub retarde fortement les triggers "schedule", et en abandonne une partie.
    # Mesuré sur les runs réels :
    #   lundi 13 juillet : 8 exécutions sur 22 déclenchées, retard moyen 180 min
    #                      (première à 22h13 UTC, soit 00h13 Paris)
    #   lundi 20 juillet : 22 sur 22, retard moyen 63 min (première à 22h49 Paris)
    #
    # Le retard frappe tous les crons de façon uniforme : avec un retard D, c'est le
    # cron placé à (21h30 Paris − D) qui atterrit à l'heure voulue. On couvre donc D
    # de 0 à ~3h30 en démarrant la fenêtre dès 16h00 UTC. Les exécutions trop précoces
    # sont gratuites : le script vérifie l'heure de Paris et sort sans rien faire avant
    # 21h30. Il s'arrête aussi si la session du jour existe déjà (idempotent), donc les
    # tentatives suivantes ne font jamais de doublon.
    #
    # La fenêtre en UTC couvre été (UTC+2) et hiver (UTC+1) sans changement.
    - cron: '0 16 * * 1'
    - cron: '15 16 * * 1'
    - cron: '30 16 * * 1'
    - cron: '45 16 * * 1'
    - cron: '0 17 * * 1'
    - cron: '15 17 * * 1'
    - cron: '30 17 * * 1'
    - cron: '45 17 * * 1'
    - cron: '0 18 * * 1'
    - cron: '15 18 * * 1'
    - cron: '30 18 * * 1'
    - cron: '45 18 * * 1'
    - cron: '0 19 * * 1'
    - cron: '15 19 * * 1'
    - cron: '30 19 * * 1'
    - cron: '35 19 * * 1'
    - cron: '40 19 * * 1'
    - cron: '45 19 * * 1'
    - cron: '50 19 * * 1'
    - cron: '55 19 * * 1'
    - cron: '0 20 * * 1'
    - cron: '10 20 * * 1'
    - cron: '20 20 * * 1'
    - cron: '30 20 * * 1'
    - cron: '40 20 * * 1'
    - cron: '50 20 * * 1'
    - cron: '0 21 * * 1'
    - cron: '10 21 * * 1'
    - cron: '20 21 * * 1'
    - cron: '30 21 * * 1'
    - cron: '40 21 * * 1'
    - cron: '50 21 * * 1'
    - cron: '0 22 * * 1'
    - cron: '10 22 * * 1'
    - cron: '20 22 * * 1'
    - cron: '30 22 * * 1'

concurrency:
  group: lock-session
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Promouvoir le créneau du jour en session figée
        env:
          TRIGGER: ${{ github.event_name }}
        run: python3 .github/scripts/lock_session.py

      - name: Commit & push si changement
        run: |
          git config user.name "five-lundi-bot"
          git config user.email "bot@five-lundi.fr"
          git add index.html
          git diff --cached --quiet && echo "Rien à committer" && exit 0
          git commit -m "Auto : lock 21h30 — compo du lundi figée dans SESSIONS"
          git push origin HEAD:main
