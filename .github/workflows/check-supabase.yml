name: Check Supabase slot_sessions

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lecture + écriture test sur slot_sessions
        run: |
          SB_URL=$(grep -o "var SB_URL *= *'[^']*'" index.html | sed "s/.*'\(.*\)'/\1/")
          SB_KEY=$(grep -o "var SB_KEY *= *'[^']*'" index.html | sed "s/.*'\(.*\)'/\1/")
          echo "→ Test lecture"
          code=$(curl -s -o /tmp/body -w '%{http_code}' "$SB_URL/rest/v1/slot_sessions?select=*" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "HTTP $code — $(cat /tmp/body)"
          test "$code" = "200"
          echo "→ Test écriture (upsert anon)"
          wcode=$(curl -s -o /tmp/wbody -w '%{http_code}' -X POST "$SB_URL/rest/v1/slot_sessions?on_conflict=slot_id" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates" \
            -d '{"slot_id":"_healthcheck","roster_key":"test","players":[]}')
          echo "HTTP $wcode — $(cat /tmp/wbody)"
          echo "→ Nettoyage"
          curl -s -X DELETE "$SB_URL/rest/v1/slot_sessions?slot_id=eq._healthcheck" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"
          case "$wcode" in 200|201|204) echo "✅ Table slot_sessions opérationnelle (lecture + écriture anon)";; *) exit 1;; esac
