name: Selftest commit via PR

# Workflow JETABLE — valide que commit_via_pr.sh crée et merge bien une PR
# avec le GITHUB_TOKEN intégré. À supprimer une fois la validation faite.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Écrire un fichier témoin
        run: date -u +"selftest %Y-%m-%dT%H:%M:%SZ" > .github/automation-selftest.txt

      - name: Commit via PR (main protégée)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/commit_via_pr.sh "Selftest : validation commit via PR" .github/automation-selftest.txt
