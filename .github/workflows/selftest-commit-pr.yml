name: Selftest commit via PR

# Workflow JETABLE — teste si GITHUB_TOKEN peut pousser directement sur main.
# À supprimer une fois la validation faite.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Écrire un fichier témoin
        run: date -u +"selftest %Y-%m-%dT%H:%M:%SZ" > .github/automation-selftest.txt

      - name: Test push direct sur main via GITHUB_TOKEN
        run: |
          git config user.name "five-lundi-bot"
          git config user.email "bot@five-lundi.fr"
          git add .github/automation-selftest.txt
          git commit -m "Selftest : push direct main via GITHUB_TOKEN"
          git push origin HEAD:main
