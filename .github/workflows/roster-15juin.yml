name: Roster 15 juin (temporaire)

on:
  workflow_dispatch:
    inputs:
      remove:
        description: 'Noms à désinscrire (séparés par des virgules)'
        required: false
        default: ''
      publish:
        description: 'JSON {note_a, note_b, players} à publier dans slot_sessions'
        required: false
        default: ''
      expected_roster:
        description: 'Top 10 attendu (CSV trié) — garde-fou avant publication'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Désinscrire / lire / publier
        env:
          REMOVE: ${{ inputs.remove }}
          PUBLISH: ${{ inputs.publish }}
          EXPECTED: ${{ inputs.expected_roster }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, urllib.parse, urllib.request
          from datetime import datetime, timezone

          html = open('index.html', encoding='utf-8').read()
          SB_URL = re.search(r"var SB_URL\s*=\s*'([^']+)'", html).group(1)
          SB_KEY = re.search(r"var SB_KEY\s*=\s*'([^']+)'", html).group(1)
          HDR = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}

          def req(path, method='GET', payload=None, extra=None):
              h = dict(HDR); h.update(extra or {})
              data = json.dumps(payload).encode() if payload is not None else None
              r = urllib.request.Request(SB_URL + path, method=method, data=data, headers=h)
              with urllib.request.urlopen(r, timeout=30) as resp:
                  return resp.status, resp.read().decode()

          SLOT = 'ins_jun_15'

          for name in [n.strip() for n in os.environ.get('REMOVE', '').split(',') if n.strip()]:
              st, _ = req('/rest/v1/registrations?slot_id=eq.%s&player_name=eq.%s'
                          % (SLOT, urllib.parse.quote(name)), 'DELETE')
              print('Désinscrit %s → HTTP %s' % (name, st))

          st, body = req('/rest/v1/registrations?slot_id=eq.%s&order=registered_at.asc&select=player_name' % SLOT)
          regs = [r['player_name'] for r in json.loads(body)]
          print('Inscrits (%d) : %s' % (len(regs), ', '.join(regs)))
          print('Top 10 : %s' % ', '.join(regs[:10]))
          if len(regs) > 10:
              print('Banc : %s' % ', '.join(regs[10:]))

          pub = os.environ.get('PUBLISH', '').strip()
          if pub:
              expected = sorted(n.strip() for n in os.environ.get('EXPECTED', '').split(',') if n.strip())
              if sorted(regs[:10]) != expected:
                  print('❌ Top 10 différent de l’attendu — publication annulée.')
                  print('   Attendu :', expected)
                  sys.exit(1)
              data = json.loads(pub)
              payload = {
                  'slot_id': SLOT,
                  'roster_key': ','.join(sorted(regs[:10])),
                  'players': data['players'],
                  'note_a': data['note_a'],
                  'note_b': data['note_b'],
                  'updated_at': datetime.now(timezone.utc).isoformat(),
              }
              st, body = req('/rest/v1/slot_sessions?on_conflict=slot_id', 'POST', payload,
                             {'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'})
              print('Upsert HTTP', st)
              assert st in (200, 201, 204), body
              print('✅ Compo publiée')
          EOF
