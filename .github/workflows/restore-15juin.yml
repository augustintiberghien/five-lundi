name: Restore roster 15 juin (annulation erreur)

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Réinscrire Alex et Flo + retirer la compo forcée
        run: |
          python3 - <<'EOF'
          import json, re, sys, urllib.parse, urllib.request
          from datetime import datetime, timedelta

          html = open('index.html', encoding='utf-8').read()
          SB_URL = re.search(r"var SB_URL\s*=\s*'([^']+)'", html).group(1)
          SB_KEY = re.search(r"var SB_KEY\s*=\s*'([^']+)'", html).group(1)
          HDR = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}

          def req(path, method='GET', payload=None, extra=None):
              h = dict(HDR); h.update(extra or {})
              data = json.dumps(payload).encode() if payload is not None else None
              r = urllib.request.Request(SB_URL + path, method=method, data=data, headers=h)
              with urllib.request.urlopen(r, timeout=30) as resp:
                  return resp.status, resp.read().decode()

          SLOT = 'ins_jun_15'

          st, body = req('/rest/v1/registrations?slot_id=eq.%s&order=registered_at.asc&select=player_name,registered_at' % SLOT)
          regs = json.loads(body)
          names = [r['player_name'] for r in regs]
          print('Avant restauration (%d) : %s' % (len(names), ', '.join(names)))

          def ts(name):
              row = next(r for r in regs if r['player_name'] == name)
              return datetime.fromisoformat(row['registered_at'].replace('Z', '+00:00'))

          def midpoint(a, b):
              ta, tb = ts(a), ts(b)
              return (ta + (tb - ta) / 2).isoformat()

          # Alex était 5e (entre Rémi et Samy), Flo 7e (entre Samy et Ibrahima)
          to_restore = [('Alex', 'Rémi', 'Samy'), ('Flo', 'Samy', 'Ibrahima')]
          for name, before, after in to_restore:
              if name in names:
                  print('%s déjà inscrit — rien à faire' % name)
                  continue
              if before not in names or after not in names:
                  print('❌ Voisins introuvables pour %s — abandon' % name)
                  sys.exit(1)
              st, body = req('/rest/v1/registrations', 'POST',
                             {'slot_id': SLOT, 'player_name': name, 'registered_at': midpoint(before, after)},
                             {'Content-Type': 'application/json', 'Prefer': 'resolution=ignore-duplicates'})
              print('Réinscrit %s → HTTP %s' % (name, st))
              assert st in (200, 201, 204), body

          st, _ = req('/rest/v1/slot_sessions?slot_id=eq.%s' % SLOT, 'DELETE')
          print('Compo forcée supprimée de slot_sessions → HTTP %s (le front regénèrera naturellement)' % st)

          st, body = req('/rest/v1/registrations?slot_id=eq.%s&order=registered_at.asc&select=player_name' % SLOT)
          final = [r['player_name'] for r in json.loads(body)]
          print('Après restauration (%d) : %s' % (len(final), ', '.join(final)))
          EOF
